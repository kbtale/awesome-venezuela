name: 🚀 Submit a Project / Proponer un Proyecto
description: Suggest an awesome Venezuelan open-source project or tool to be included in the list.
title: "[Project]: "
labels: ["project-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping highlight Venezuelan engineering talent!
        Please ensure the project complies with our [Contribution Guidelines](https://github.com/kbtale/awesome-venezuela/blob/main/CONTRIBUTING.md).

  - type: input
    id: project_name
    attributes:
      label: Project Name / Nombre del Proyecto
      placeholder: e.g. Awesome Project
    validations:
      required: true

  - type: input
    id: project_url
    attributes:
      label: Repository URL / URL del Repositorio
      placeholder: https://github.com/username/project
    validations:
      required: true

  - type: input
    id: creator_info
    attributes:
      label: Creator Name and Profile / Nombre del Creador y Perfil
      placeholder: "[Name](https://github.com/username)"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Target Category / Categoría de Destino
      options:
        - "Artificial Intelligence & Data Science / Inteligencia Artificial y Ciencia de Datos"
        - "Backend & Web Frameworks / Backend y Frameworks Web"
        - "CLI Tools & Utilities / Herramientas de Consola y Utilidades"
        - "DevOps, Cloud & Infrastructure / DevOps, Cloud e Infraestructura"
        - "Frontend, Mobile & UI / Frontend, Móvil e Interfaces"
        - "Libraries & Packages / Librerías y Paquetes"
        - "Security & Networking / Seguridad y Redes"
        - "Other / Otra categoría (especificar abajo)"
    validations:
      required: true

  - type: textarea
    id: description_en
    attributes:
      label: Project Description (English)
      description: 2-4 sentences explaining what the project does.
      placeholder: A modern toolkit for...
    validations:
      required: true

  - type: textarea
    id: description_es
    attributes:
      label: Descripción del Proyecto (Español)
      description: 2-4 oraciones explicando qué hace el proyecto.
      placeholder: Un conjunto de herramientas modernas para...
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Criteria Checklist / Lista de Verificación
      options:
        - label: Built by a Venezuelan creator / Creado por un(a) desarrollador(a) venezolano(a).
          required: true
        - label: The source code is publicly accessible / El código fuente es de acceso público.
        - label: Original project (not an unmodified generic tutorial clone) / Proyecto original (no un clon de tutorial genérico sin modificaciones).
        - label: I agree to follow the [Code of Conduct](https://github.com/kbtale/awesome-venezuela/blob/main/CODE_OF_CONDUCT.md) / Acepto seguir el Código de Conducta.
          required: true
